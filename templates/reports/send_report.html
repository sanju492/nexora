
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NEXORA | Send Report</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 22px;
            font-family: "Segoe UI", Arial, sans-serif;
            color: #edf5ff;
            background: linear-gradient(135deg, #081225, #123252, #07101f);
            min-height: 100vh;
        }
        main {
            max-width: 650px; margin: 35px auto; padding: 28px;
            background: rgba(255,255,255,.07);
            border: 1px solid rgba(255,255,255,.12);
            border-radius: 18px;
        }
        .brand { color: #67e8f9; font-size: 23px; font-weight: 800; letter-spacing: 2px; }
        label { display: block; margin: 18px 0 8px; font-weight: 600; }
        input, select, textarea {
            width: 100%; padding: 13px; border-radius: 9px;
            border: 1px solid #52657d; background: #101e32;
            color: white; font: inherit;
        }
        textarea { min-height: 160px; resize: vertical; }
        button, .button {
            display: inline-block; border: 0; padding: 12px 17px;
            border-radius: 9px; background: #0891b2; color: white;
            font-weight: 700; text-decoration: none; cursor: pointer;
        }
        .button { background: #263b54; }
        .actions { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 20px; }
        .error {
            padding: 12px; border-radius: 8px;
            background: #7f1d1d; color: #fee2e2;
        }
        .muted { color: #aabbd3; }
    </style>
</head>
<body>
<main>
    <div class="brand">NEXORA</div>
    <h1>Send a Report</h1>
    <p class="muted">Choose an authorized recipient and enter your message.</p>

    {% if error %}
        <p class="error">{{ error }}</p>
    {% endif %}

    <form method="post">
        {% csrf_token %}

        <label for="receiver">Send To</label>
        <select name="receiver" id="receiver" required>
            <option value="">-- Select recipient --</option>
            {% for recipient in recipients %}
                <option value="{{ recipient.pk }}">
                    {{ recipient.username }}{% if recipient.role %} — {{ recipient.role|title }}{% endif %}
                </option>
            {% endfor %}
        </select>

        <label for="subject">Subject</label>
        <input
            type="text"
            name="subject"
            id="subject"
            maxlength="200"
            placeholder="Enter report subject"
            required
        >

        <label for="message">Message</label>
        <textarea
            name="message"
            id="message"
            placeholder="Write your report here..."
            required
        ></textarea>

        <div class="actions">
            <button type="submit">Send Report</button>
            <a class="button" href="{% url 'reports:reports_dashboard' %}">Cancel</a>
        </div>
    </form>
</main>
</body>
</html>
