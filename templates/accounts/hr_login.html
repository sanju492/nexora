<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NEXORA | HR Login</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Arial,
                sans-serif;

            color: white;

            background-image:
                url("/static/images/NEXORA.png");

            background-size: cover;

            background-position: center;

            background-attachment: fixed;

            padding: 30px;
        }


        .login-container {

            width: 100%;

            max-width: 460px;

        }


        .brand {

            text-align: center;

            font-size: 13px;

            letter-spacing: 5px;

            color: rgba(255,255,255,0.75);

            margin-bottom: 14px;

        }


        .title {

            text-align: center;

            font-size: 42px;

            font-weight: 400;

            letter-spacing: -1.5px;

            margin-bottom: 8px;

        }


        .subtitle {

            text-align: center;

            color: rgba(255,255,255,0.68);

            font-size: 15px;

            margin-bottom: 32px;

        }


        /* LIQUID GLASS CARD */

        .login-card {

            padding: 38px;

            border-radius: 30px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.20),
                    rgba(255,255,255,0.08)
                );

            border:
                1px solid
                rgba(255,255,255,0.32);

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,0.38),

                inset 0 -1px 0
                rgba(0,0,0,0.12),

                0 25px 70px
                rgba(0,0,0,0.30);

            backdrop-filter:
                blur(18px)
                saturate(150%);

            -webkit-backdrop-filter:
                blur(18px)
                saturate(150%);
        }


        .field {

            margin-bottom: 20px;

        }


        .field label {

            display: block;

            font-size: 13px;

            color:
                rgba(255,255,255,0.72);

            margin-bottom: 8px;

        }


        .field input {

            width: 100%;

            height: 54px;

            padding: 0 17px;

            border-radius: 16px;

            border:
                1px solid
                rgba(255,255,255,0.22);

            outline: none;

            color: white;

            font-size: 15px;

            background:
                rgba(255,255,255,0.10);

            box-shadow:
                inset 0 1px 0
                rgba(255,255,255,0.15);

            transition: 0.3s;
        }


        .field input::placeholder {

            color:
                rgba(255,255,255,0.48);

        }


        .field input:focus {

            border-color:
                rgba(255,255,255,0.50);

            background:
                rgba(255,255,255,0.15);

            box-shadow:
                0 0 0 3px
                rgba(255,255,255,0.07);

        }


        /* LOGIN BUTTON */

        .login-btn {

            width: 100%;

            height: 54px;

            border: 1px solid
                rgba(255,255,255,0.35);

            border-radius: 999px;

            color: white;

            font-size: 15px;

            font-weight: 600;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.28),
                    rgba(255,255,255,0.12)
                );

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,0.40),

                0 10px 25px
                rgba(0,0,0,0.18);

            transition: 0.3s;

        }


        .login-btn:hover {

            transform:
                translateY(-2px);

            background:
                rgba(255,255,255,0.24);

            box-shadow:

                inset 0 1px 0
                rgba(255,255,255,0.45),

                0 15px 30px
                rgba(0,0,0,0.25);

        }


        /* MESSAGE */

        .messages {

            margin-bottom: 20px;

        }


        .message {

            padding: 12px 15px;

            border-radius: 14px;

            font-size: 13px;

            background:
                rgba(255,255,255,0.12);

            border:
                1px solid
                rgba(255,255,255,0.20);

            color:
                rgba(255,255,255,0.88);

        }


        /* REGISTER */

        .register {

            text-align: center;

            margin-top: 25px;

            color:
                rgba(255,255,255,0.65);

            font-size: 14px;

        }


        .register a {

            color: white;

            font-weight: 600;

            text-decoration: none;

        }


        .register a:hover {

            text-decoration: underline;

        }


        .back {

            text-align: center;

            margin-top: 20px;

        }


        .back a {

            color:
                rgba(255,255,255,0.60);

            font-size: 13px;

            text-decoration: none;

        }


        .back a:hover {

            color: white;

        }


        @media(max-width: 600px) {

            body {

                padding: 20px;

            }

            .login-card {

                padding: 28px 22px;

            }

            .title {

                font-size: 34px;

            }

        }

    </style>

</head>


<body>


<div class="login-container">


    <div class="brand">
        NEXORA HRMS
    </div>


    <h1 class="title">
        HR Login
    </h1>


    <p class="subtitle">
        Access your Human Resources workspace
    </p>


    <div class="login-card">


        {% if messages %}

            <div class="messages">

                {% for message in messages %}

                    <div class="message">
                        {{ message }}
                    </div>

                {% endfor %}

            </div>

        {% endif %}


        <form method="POST">

            {% csrf_token %}


            <div class="field">

                <label>
                    Username
                </label>

                <input
                    type="text"
                    name="username"
                    placeholder="Enter your username"
                    required
                >

            </div>


            <div class="field">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter your password"
                    required
                >

            </div>


            <button
                type="submit"
                class="login-btn"
            >
                Login as HR →
            </button>

        </form>


        <div class="register">

            New HR?

            <a href="{% url 'hr_register' %}">
                Register as HR
            </a>

        </div>


        <div class="back">

            <a href="{% url 'home' %}">
                ← Back to NEXORA
            </a>

        </div>


    </div>


</div>


</body>

</html>
