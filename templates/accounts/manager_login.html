{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>NEXORA | Manager Login</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            min-height: 100vh;
            color: #ffffff;
            background: #10141b;
        }

        /* =========================================
           BACKGROUND
        ========================================= */

        .page-background {

            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            background-image:
                linear-gradient(
                    rgba(5, 10, 18, 0.38),
                    rgba(5, 10, 18, 0.58)
                ),
                url("{% static 'images/NEXORA.png' %}");

            background-size: cover;

            background-position: center;

            background-repeat: no-repeat;

            z-index: -2;
        }


        .page-overlay {

            position: fixed;

            inset: 0;

            background:
                radial-gradient(
                    circle at 50% 35%,
                    rgba(80, 150, 255, 0.12),
                    transparent 45%
                );

            z-index: -1;
        }


        /* =========================================
           MAIN
        ========================================= */

        .login-page {

            min-height: 100vh;

            display: flex;

            align-items: center;

            justify-content: center;

            padding: 30px;
        }


        /* =========================================
           LOGIN CARD
        ========================================= */

        .login-card {

            width: 100%;

            max-width: 470px;

            padding: 48px 42px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.10);

            border: 1px solid rgba(255, 255, 255, 0.25);

            backdrop-filter: blur(25px);

            -webkit-backdrop-filter: blur(25px);

            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.45);

            text-align: center;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo {

            width: 72px;

            height: 72px;

            margin: 0 auto 22px;

            border-radius: 22px;

            display: flex;

            align-items: center;

            justify-content: center;

            font-size: 30px;

            font-weight: 600;

            background: rgba(255, 255, 255, 0.13);

            border: 1px solid rgba(255, 255, 255, 0.30);

            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.25),
                0 10px 30px rgba(0, 0, 0, 0.25);
        }


        .eyebrow {

            font-size: 13px;

            letter-spacing: 3px;

            color: rgba(255, 255, 255, 0.65);

            margin-bottom: 12px;

            text-transform: uppercase;
        }


        h1 {

            font-size: 36px;

            font-weight: 500;

            letter-spacing: -1px;

            margin-bottom: 12px;
        }


        .subtitle {

            font-size: 16px;

            line-height: 1.6;

            color: rgba(255, 255, 255, 0.68);

            margin-bottom: 34px;
        }


        /* =========================================
           FORM
        ========================================= */

        .form-group {

            text-align: left;

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            margin-bottom: 9px;

            font-size: 15px;

            color: rgba(255, 255, 255, 0.82);
        }


        .form-group input {

            width: 100%;

            height: 56px;

            padding: 0 18px;

            border-radius: 16px;

            border: 1px solid rgba(255, 255, 255, 0.22);

            outline: none;

            color: #ffffff;

            font-size: 16px;

            background: rgba(255, 255, 255, 0.09);

            backdrop-filter: blur(12px);

            -webkit-backdrop-filter: blur(12px);

            transition: 0.25s ease;
        }


        .form-group input::placeholder {

            color: rgba(255, 255, 255, 0.42);
        }


        .form-group input:focus {

            border-color: rgba(255, 255, 255, 0.55);

            background: rgba(255, 255, 255, 0.13);

            box-shadow:
                0 0 0 4px rgba(255, 255, 255, 0.06);
        }


        /* =========================================
           ERROR MESSAGE
        ========================================= */

        .messages {

            margin-bottom: 20px;

            text-align: left;
        }


        .message {

            padding: 13px 16px;

            border-radius: 14px;

            font-size: 14px;

            background: rgba(255, 80, 80, 0.14);

            border: 1px solid rgba(255, 100, 100, 0.25);

            color: #ffffff;
        }


        /* =========================================
           LOGIN BUTTON
        ========================================= */

        .login-button {

            width: 100%;

            height: 58px;

            border: 1px solid rgba(255, 255, 255, 0.35);

            border-radius: 18px;

            color: #ffffff;

            font-size: 16px;

            font-weight: 500;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.23),
                    rgba(255, 255, 255, 0.08)
                );

            backdrop-filter: blur(20px);

            -webkit-backdrop-filter: blur(20px);

            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.28),
                0 12px 30px rgba(0, 0, 0, 0.22);

            transition: 0.25s ease;
        }


        .login-button:hover {

            transform: translateY(-2px);

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 255, 255, 0.30),
                    rgba(255, 255, 255, 0.12)
                );

            box-shadow:
                inset 0 1px 1px rgba(255, 255, 255, 0.35),
                0 16px 35px rgba(0, 0, 0, 0.28);
        }


        .login-button span {

            margin-left: 8px;

            font-size: 18px;
        }


        /* =========================================
           FOOTER LINKS
        ========================================= */

        .authorized {

            margin-top: 25px;

            font-size: 13px;

            color: rgba(255, 255, 255, 0.48);

            letter-spacing: 0.5px;
        }


        .back-home {

            display: inline-block;

            margin-top: 22px;

            color: rgba(255, 255, 255, 0.72);

            text-decoration: none;

            font-size: 14px;

            transition: 0.2s ease;
        }


        .back-home:hover {

            color: #ffffff;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 600px) {

            .login-page {

                padding: 20px;
            }

            .login-card {

                padding: 38px 25px;

                border-radius: 25px;
            }

            h1 {

                font-size: 30px;
            }

            .subtitle {

                font-size: 15px;
            }
        }

    </style>

</head>


<body>


    <!-- BACKGROUND -->

    <div class="page-background"></div>

    <div class="page-overlay"></div>


    <!-- LOGIN -->

    <main class="login-page">

        <div class="login-card">


            <div class="logo">
                N
            </div>


            <div class="eyebrow">
                NEXORA HRMS
            </div>


            <h1>
                Manager Login
            </h1>


            <p class="subtitle">
                Sign in to access the NEXORA manager workspace.
            </p>


            <!-- MESSAGES -->

            {% if messages %}

                <div class="messages">

                    {% for message in messages %}

                        <div class="message">
                            {{ message }}
                        </div>

                    {% endfor %}

                </div>

            {% endif %}


            <!-- LOGIN FORM -->

            <form method="POST">

                {% csrf_token %}


                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Enter username"
                        autocomplete="username"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter password"
                        autocomplete="current-password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Manager Login

                    <span>→</span>

                </button>

            </form>


            <div class="authorized">
                Authorized access only
            </div>


            <a
                href="{% url 'home' %}"
                class="back-home">

                ← Back to NEXORA

            </a>


        </div>

    </main>


</body>

</html>
